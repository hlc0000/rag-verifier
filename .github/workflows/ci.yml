name: CI

on: [push, pull_request]

jobs:
  rule-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: pip install .
      - name: zh/en rule parity check (deterministic, no LLM calls)
        run: python scripts/rule_parity_check.py
