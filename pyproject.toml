[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-verifier"
version = "0.1.0"
description = "Chunk-level quality verification for RAG ingestion: independence, completeness, traceability, semantic independence, template completeness"
readme = "README.md"
requires-python = ">=3.10"
# 验证层只用标准库；解析/检索的依赖由各自模块按需引入（docling 走独立 venv）。
dependencies = []

[project.optional-dependencies]
parse = ["pymupdf>=1.23", "marko>=2.0", "lxml>=4.9"]

[tool.setuptools.packages.find]
include = ["rag_verifier*"]
